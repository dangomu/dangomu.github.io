
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRAL ARCHIVE</title>

<style>
:root {
  --navy: #050811;
  --text: #f0f1f6;
  --muted: #a4a9ba;
  --gold: #c9bd9d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #030407;
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
}

body { overflow-x: hidden; }
button, input { font: inherit; }

/* LOADING */

#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #101321 0%, #070910 40%, #030407 78%);
  opacity: 1;
}

.loading-stars,
#mainStars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.loading-star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  opacity: .4;
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .12; transform: scale(.7); }
  to { opacity: .8; transform: scale(1.5); }
}

.instruction {
  position: absolute;
  right: 8%;
  bottom: 8%;
  z-index: 5;
  text-align: right;
  color: rgba(235,235,245,.75);
  letter-spacing: .22em;
  font-size: 11px;
  line-height: 2;
  pointer-events: none;
}

.instruction span {
  display: block;
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .18em;
  color: rgba(235,235,245,.45);
}

.meteor {
  position: absolute;
  width: 180px;
  height: 70px;
  z-index: 10;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transform: rotate(135deg);
}

.meteor::before {
  content: "";
  position: absolute;
  left: 0;
  top: 34px;
  width: 155px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3) 35%,
    #fff 100%
  );
  box-shadow: 0 0 8px #fff, 0 0 20px rgba(160,190,255,.8);
}

.meteor::after {
  content: "";
  position: absolute;
  right: 15px;
  top: 30px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 12px 5px white,
    0 0 28px 10px rgba(160,190,255,.7);
}

@keyframes meteorFlight {
  0% { left: 110%; top: -5%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { left: -25%; top: 110%; opacity: 0; }
}

@keyframes starCatch {
  to {
    opacity: 0;
    transform: rotate(135deg) scale(3);
    filter: brightness(3);
  }
}

/* MAIN */

#main {
  display: none;
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #101629 0%, #070b15 48%, #04060c 100%);
}

#mainStars { z-index: 0; }

.constellation-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.constellation {
  position: absolute;
  overflow: visible;
  opacity: .11;
}

.constellation line,
.constellation polyline {
  fill: none;
  stroke: #b8c9e7;
  stroke-width: .65;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.constellation circle {
  fill: #dce7ff;
  opacity: .65;
}

.constellation .glow-star {
  fill: #fff;
  opacity: .8;
  filter: drop-shadow(0 0 3px #dce7ff);
  animation: constellationGlow 5s ease-in-out infinite alternate;
}

@keyframes constellationGlow {
  0% { opacity: .18; filter: drop-shadow(0 0 1px #dce7ff); }
  100% { opacity: .9; filter: drop-shadow(0 0 7px #dce7ff); }
}

.constellation-one {
  width: 210px;
  top: 5%;
  left: -55px;
  transform: rotate(-12deg);
}

.constellation-two {
  width: 220px;
  top: 28%;
  right: -95px;
  transform: rotate(15deg);
}

.constellation-three {
  width: 190px;
  top: 57%;
  left: -65px;
  transform: rotate(10deg);
}

.constellation-four {
  width: 210px;
  top: 80%;
  right: -95px;
  transform: rotate(-15deg);
}

#main header,
#main .page-controls,
#main .character-list {
  position: relative;
  z-index: 2;
}

header {
  padding: 48px 7% 28px;
  text-align: center;
}

.site-title {
  font-size: 23px;
  letter-spacing: .28em;
  font-weight: normal;
}

.site-jp-title {
  margin-top: 10px;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .2em;
  color: rgba(235,235,245,.75);
}

.site-subtitle {
  margin-top: 28px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .16em;
  line-height: 1.8;
}

.site-tagline {
  margin-top: 8px;
  color: rgba(235,235,245,.65);
  font-family: sans-serif;
  font-size: 11px;
  letter-spacing: .12em;
}

/* CATEGORY */

.page-controls {
  width: min(900px, 88%);
  margin: 8px auto 0;
}

.category-switch {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.category-button {
  width: 116px;
  min-height: 92px;
  padding: 12px 8px 10px;
  border: 1px solid rgba(210,220,245,.17);
  border-radius: 3px;
  background: rgba(10,16,31,.48);
  color: rgba(225,231,245,.65);
  cursor: pointer;
  transition: .35s ease;
  -webkit-tap-highlight-color: transparent;
}

.category-button.active {
  border-color: rgba(211,199,164,.65);
  background: rgba(201,189,157,.075);
  color: #eee8d8;
  box-shadow: 0 0 18px rgba(190,190,220,.07);
}

.category-button:active { transform: scale(.96); }

.category-icon {
  display: block;
  width: 56px;
  height: 42px;
  margin: 0 auto 8px;
  overflow: visible;
}

.category-icon line,
.category-icon polyline {
  fill: none;
  stroke: #cbd8f0;
  stroke-width: 1;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .75;
}

.category-icon circle {
  fill: #dce8ff;
  filter: drop-shadow(0 0 3px #dce8ff);
}

.category-button.active .category-icon circle {
  fill: #fff;
  filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 8px #cbd8ff);
}

.category-label {
  display: block;
  font-size: 10px;
  letter-spacing: .16em;
  white-space: nowrap;
}

/* SEARCH */

.list-tools {
  margin: 28px auto 0;
  width: min(900px, 100%);
}

.character-count {
  margin-bottom: 12px;
  color: rgba(220,225,240,.65);
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .18em;
  text-align: right;
}

.search-wrap { position: relative; }

.search-input {
  display: block;
  width: 100%;
  padding: 13px 40px 13px 15px;
  border: 1px solid rgba(210,220,240,.18);
  border-radius: 2px;
  outline: none;
  background: rgba(5,9,19,.55);
  color: #f0f1f6;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .08em;
}

.search-input::placeholder { color: rgba(190,198,218,.42); }
.search-input:focus { border-color: rgba(201,189,157,.55); }

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(210,220,240,.5);
  font-size: 15px;
  pointer-events: none;
}

/* CHARACTER LIST */

.character-list {
  width: min(900px, 88%);
  margin: 28px auto 80px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 35px 22px;
}

.character-card {
  cursor: pointer;
  text-align: center;
  min-width: 0;
}

.character-image-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #101321;
  border: 1px solid rgba(210,210,230,.12);
  overflow: hidden;
}

.character-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity .3s;
}

.character-card:active .character-image { opacity: .7; }

.character-number {
  position: absolute;
  top: 9px;
  left: 9px;
  z-index: 2;
  padding: 5px 7px;
  color: rgba(245,246,250,.9);
  background: rgba(4,7,14,.7);
  border: 1px solid rgba(220,225,240,.2);
  font-family: sans-serif;
  font-size: 9px;
  letter-spacing: .1em;
}

.character-name {
  margin-top: 15px;
  font-size: 21px;
  letter-spacing: .14em;
}

.character-jp {
  margin-top: 5px;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .15em;
}

.no-results {
  grid-column: 1 / -1;
  padding: 55px 10px;
  color: rgba(220,225,240,.5);
  text-align: center;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .12em;
  line-height: 2;
}

/* CONSTELLATION CUT-IN */

#constellationCutin {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3,6,15,.91);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#constellationCutin.show {
  visibility: visible;
  animation: cutinFade 2.1s ease forwards;
}

.cutin-inner {
  width: min(340px, 78vw);
  text-align: center;
  transform: scale(.88);
}

#constellationCutin.show .cutin-inner {
  animation: constellationReveal 2.1s ease forwards;
}

.cutin-svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.cutin-lines {
  fill: none;
  stroke: rgba(205,220,248,.85);
  stroke-width: 1;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
}

#constellationCutin.show .cutin-lines {
  animation: drawConstellation 1.05s ease .28s forwards;
}

.cutin-star {
  fill: #fff;
  opacity: 0;
  filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #a9c8ff);
  transform-box: fill-box;
  transform-origin: center;
}

#constellationCutin.show .cutin-star {
  animation: starAppear .35s ease forwards;
}

#constellationCutin.show .cutin-star:nth-of-type(2) { animation-delay: .12s; }
#constellationCutin.show .cutin-star:nth-of-type(3) { animation-delay: .22s; }
#constellationCutin.show .cutin-star:nth-of-type(4) { animation-delay: .32s; }
#constellationCutin.show .cutin-star:nth-of-type(5) { animation-delay: .42s; }
#constellationCutin.show .cutin-star:nth-of-type(6) { animation-delay: .52s; }
#constellationCutin.show .cutin-star:nth-of-type(7) { animation-delay: .62s; }

.cutin-name {
  margin-top: 22px;
  color: #eee8d8;
  font-size: 13px;
  letter-spacing: .3em;
  opacity: 0;
}

#constellationCutin.show .cutin-name {
  animation: nameAppear .7s ease .65s forwards;
}

@keyframes cutinFade {
  0% { opacity: 0; }
  12% { opacity: 1; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes constellationReveal {
  0% { transform: scale(.82); opacity: .4; }
  25% { transform: scale(1); opacity: 1; }
  75% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.08); opacity: 0; }
}

@keyframes drawConstellation {
  to { stroke-dashoffset: 0; }
}

@keyframes starAppear {
  0% { opacity: 0; transform: scale(.2); }
  70% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes nameAppear {
  to { opacity: .85; }
}

/* DETAIL */

#detail {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 30;
  background: #050811;
  -webkit-overflow-scrolling: touch;
}

.detail-content {
  position: relative;
  width: min(650px, 88%);
  margin: auto;
  padding: 25px 0 75px;
}

.back-button {
  display: inline-block;
  border: 1px solid rgba(220,225,240,.2);
  border-radius: 2px;
  background: rgba(255,255,255,.025);
  color: #d8dce8;
  letter-spacing: .14em;
  font-size: 11px;
  padding: 12px 18px;
  cursor: pointer;
}

.detail-image {
  display: block;
  width: min(340px, 88%);
  aspect-ratio: 3 / 4;
  object-fit: cover;
  margin: 32px auto;
  border: 1px solid rgba(220,220,240,.16);
}

.detail-name {
  text-align: center;
  font-size: 29px;
  letter-spacing: .14em;
  font-weight: normal;
  line-height: 1.5;
  margin: 0;
}

.detail-jp {
  text-align: center;
  font-family: sans-serif;
  font-size: 15px;
  letter-spacing: .18em;
  margin-top: 10px;
}

/* PROFILE */

.section {
  margin-top: 42px;
  padding-top: 24px;
  border-top: 1px solid rgba(220,225,240,.13);
}

.section-title {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .22em;
  margin-bottom: 22px;
}

.profile-item { margin-top: 21px; }

.profile-label {
  margin-bottom: 8px;
  color: #aeb8ce;
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .2em;
}

.section-text {
  white-space: pre-wrap;
  line-height: 2.05;
  font-family: sans-serif;
  font-size: 14px;
  color: #e0e3ec;
  overflow-wrap: anywhere;
}

/* COPY */

.copy-button {
  display: block;
  width: 100%;
  margin-top: 42px;
  padding: 17px;
  border: 1px solid rgba(220,225,240,.28);
  border-radius: 2px;
  background: #111a2b;
  color: white;
  letter-spacing: .2em;
  font-size: 11px;
  cursor: pointer;
}

.copy-button:active { background: #1b2940; }

/* PROMPT */

.prompt-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid rgba(220,225,240,.13);
}

.prompt-box {
  padding: 20px;
  background: #0b1120;
  border: 1px solid rgba(220,225,240,.14);
  border-radius: 3px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: sans-serif;
  font-size: 13px;
  line-height: 1.9;
  color: #e0e3ec;
}

/* MOBILE */

@media (max-width: 480px) {
  header { padding-top: 42px; }
  .site-title { font-size: 20px; }
  .site-subtitle { font-size: 9px; }
  .site-tagline { font-size: 10px; }
  .category-switch { gap: 13px; }

  .category-button {
    width: 108px;
    min-height: 88px;
  }

  .character-list { gap: 28px 14px; }
  .character-name { font-size: 17px; }
  .detail-content { width: 88%; }
  .detail-name { font-size: 25px; }
  .section-text { font-size: 14px; }
  .constellation-one { left: -100px; }
  .constellation-two { right: -125px; }
  .constellation-three { left: -110px; }
  .constellation-four { right: -125px; }
}

/* HIDDEN FORTUNE STAR */

#fortuneTrigger {
  position: absolute;
  top: 130px;
  left: 4%;
  z-index: 4;
  width: 54px;
  height: 54px;
  padding: 0;
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: fortuneTwinkle 2.2s ease-in-out infinite;
}

#fortuneTrigger span {
  position: absolute;
  inset: 0;
  font-size: 49px;
  line-height: 54px;
  text-shadow: 0 0 7px #fff, 0 0 18px rgba(190,210,255,.8);
}

#fortuneTrigger small {
  position: absolute;
  top: 22px;
  left: 0;
  width: 100%;
  color: #172035;
  font-family: sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: .08em;
}

@keyframes fortuneTwinkle {
  0%, 100% { opacity: .45; transform: scale(.92); }
  50% { opacity: 1; transform: scale(1.08); }
}

/* FORTUNE POPUP */

#fortuneModal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 70;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.fortune-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(2,4,12,.86);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.fortune-panel {
  position: relative;
  z-index: 1;
  width: min(380px, 100%);
  padding: 34px 25px 25px;
  border: 1px solid rgba(201,189,157,.55);
  background:
    radial-gradient(ellipse at 50% 0%, #1a2238 0%, #0b1120 65%, #070b14 100%);
  box-shadow: 0 0 35px rgba(130,150,210,.13);
  text-align: center;
  animation: fortuneAppear .45s ease both;
}

@keyframes fortuneAppear {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.fortune-ornament {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .25em;
}

.fortune-title {
  margin: 17px 0 8px;
  color: #f0f1f6;
  font-size: 21px;
  font-weight: normal;
  letter-spacing: .13em;
}

.fortune-subtitle {
  color: #a4a9ba;
  font-family: sans-serif;
  font-size: 11px;
  letter-spacing: .08em;
}

.fortune-divider {
  height: 1px;
  margin: 25px 0;
  background: linear-gradient(90deg, transparent, rgba(201,189,157,.65), transparent);
}

.fortune-label {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .22em;
}

.fortune-result {
  margin-top: 12px;
  color: #f0f1f6;
  font-size: 22px;
  letter-spacing: .08em;
}

.fortune-close {
  margin-top: 28px;
  padding: 12px 35px;
  border: 1px solid rgba(201,189,157,.45);
  background: rgba(255,255,255,.025);
  color: #e5e1d5;
  font-size: 11px;
  letter-spacing: .2em;
  cursor: pointer;
}
  
</style>
</head>

<body>

<!-- LOADING -->

<div id="loading">
  <div class="loading-stars" id="loadingStars"></div>
  <div class="instruction">
    CATCH THE STAR
    <span>星を掴んで</span>
  </div>
</div>

<!-- MAIN -->

<div id="main">

  <div id="mainStars"></div>

  <div class="constellation-layer">

    <svg class="constellation constellation-one" viewBox="0 0 240 220">
      <polyline points="25,55 65,85 105,35 145,75 195,45"/>
      <line x1="65" y1="85" x2="85" y2="150"/>
      <line x1="85" y1="150" x2="145" y2="75"/>
      <circle cx="25" cy="55" r="2"/>
      <circle cx="65" cy="85" r="2"/>
      <circle class="glow-star" cx="105" cy="35" r="3"/>
      <circle cx="145" cy="75" r="2"/>
      <circle cx="195" cy="45" r="2"/>
      <circle cx="85" cy="150" r="2"/>
    </svg>

    <svg class="constellation constellation-two" viewBox="0 0 260 220">
      <polyline points="35,105 75,65 120,85 160,35 200,80 225,145"/>
      <line x1="75" y1="65" x2="85" y2="155"/>
      <line x1="85" y1="155" x2="145" y2="170"/>
      <line x1="145" y1="170" x2="200" y2="80"/>
      <circle cx="35" cy="105" r="2"/>
      <circle class="glow-star" cx="75" cy="65" r="3"/>
      <circle cx="120" cy="85" r="2"/>
      <circle cx="160" cy="35" r="2"/>
      <circle cx="200" cy="80" r="2"/>
      <circle cx="225" cy="145" r="2"/>
      <circle cx="85" cy="155" r="2"/>
      <circle cx="145" cy="170" r="2"/>
    </svg>

    <svg class="constellation constellation-three" viewBox="0 0 230 220">
      <polyline points="30,45 75,90 115,55 145,110 180,145"/>
      <line x1="75" y1="90" x2="65" y2="155"/>
      <line x1="65" y1="155" x2="145" y2="110"/>
      <circle cx="30" cy="45" r="2"/>
      <circle cx="75" cy="90" r="2"/>
      <circle class="glow-star" cx="115" cy="55" r="3"/>
      <circle cx="145" cy="110" r="2"/>
      <circle cx="180" cy="145" r="2"/>
      <circle cx="65" cy="155" r="2"/>
    </svg>

    <svg class="constellation constellation-four" viewBox="0 0 230 220">
      <polyline points="35,70 85,35 130,80 175,55 195,120"/>
      <line x1="85" y1="35" x2="95" y2="130"/>
      <line x1="95" y1="130" x2="150" y2="160"/>
      <circle cx="35" cy="70" r="2"/>
      <circle class="glow-star" cx="85" cy="35" r="3"/>
      <circle cx="130" cy="80" r="2"/>
      <circle cx="175" cy="55" r="2"/>
      <circle cx="195" cy="120" r="2"/>
      <circle cx="95" cy="130" r="2"/>
      <circle cx="150" cy="160" r="2"/>
    </svg>

  </div>

  <header>
    <div class="site-title">ASTRAL ARCHIVE</div>
    <div class="site-jp-title">アストラル・アーカイブ</div>
    <div class="site-subtitle">STORIES GATHERED BENEATH THE STARS</div>

/* STARS */

function addStars(containerId, count, subtle = false) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    star.className = "loading-star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (3 + Math.random() * 5) + "s";

    if (subtle) {
      star.style.opacity = Math.random() * .25;
      star.style.width = "1px";
      star.style.height = "1px";
    }

    container.appendChild(star);
  }
}

let meteorTimer = null;
let hasEntered = false;

function createMeteor() {
  if (hasEntered) return;

  const meteor = document.createElement("div");
  meteor.className = "meteor";

  document.getElementById("loading").appendChild(meteor);
  meteor.style.animation = "meteorFlight 3.5s linear forwards";

  meteor.addEventListener("pointerdown", catchStar, { once: true });

  meteor.addEventListener("animationend", () => {
    meteor.remove();

    if (!hasEntered) {
      meteorTimer = setTimeout(createMeteor, 1400);
    }
  }, { once: true });
}

function catchStar(event) {
  if (hasEntered) return;

  hasEntered = true;

  const meteor = event.currentTarget;
  clearTimeout(meteorTimer);

  meteor.style.animation = "starCatch .6s ease-out forwards";

  setTimeout(() => {
    const loading = document.getElementById("loading");

    loading.style.transition = "opacity 1.2s ease";
    loading.style.opacity = "0";

    setTimeout(() => {
      loading.style.display = "none";
      document.getElementById("main").style.display = "block";
    }, 1200);

  }, 350);
}

function showConstellationCutin(category) {
  const pattern = constellationPatterns[category];
  const overlay = document.getElementById("constellationCutin");
  const svg = document.getElementById("cutinSvg");
  const name = document.getElementById("cutinName");

  svg.innerHTML = "";

  const lines = document.createElementNS("http://www.w3.org/2000/svg", "g");
  lines.setAttribute("class", "cutin-lines");

  pattern.lines.forEach(points => {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", points[0]);
    line.setAttribute("y1", points[1]);
    line.setAttribute("x2", points[2]);
    line.setAttribute("y2", points[3]);
    lines.appendChild(line);
  });

  svg.appendChild(lines);

  pattern.stars.forEach((point, index) => {
    const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    star.setAttribute("cx", point[0]);
    star.setAttribute("cy", point[1]);
    star.setAttribute("r", index === 2 ? "4" : "3");
    star.setAttribute("class", "cutin-star");
    svg.appendChild(star);
  });

  name.textContent = pattern.name;

  overlay.classList.remove("show");
  void overlay.offsetWidth;
  overlay.classList.add("show");
}

      <div class="character-jp"></div>
    `;

    card.querySelector(".character-name").textContent = character.name;
    card.querySelector(".character-jp").textContent = character.japanese;

    card.addEventListener("click", () => {
      openDetail(characters.indexOf(character));
    });

    list.appendChild(card);
  });
}

renderCharacters();

/* COPY PROMPT */

function copyPrompt() {
  const text = document.getElementById("promptText").textContent;
  const button = document.querySelector(".copy-button");

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      button.textContent = "COPIED ✓";

      setTimeout(() => {
        button.textContent = "COPY PROMPT";
      }, 1800);
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }

  function fallbackCopy() {
    const textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.select();

    try {
      document.execCommand("copy");
      button.textContent = "COPIED ✓";
    } catch (error) {
      button.textContent = "SELECT AND COPY";
    }

    document.body.removeChild(textarea);

    setTimeout(() => {
      button.textContent = "COPY PROMPT";
    }, 1800);
  }
}

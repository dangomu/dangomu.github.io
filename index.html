
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRAL ARCHIVE</title>

<style>
:root {
  --navy: #050811;
  --text: #f0f1f6;
  --muted: #a4a9ba;
  --gold: #c9bd9d;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #030407;
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
}

body {
  overflow-x: hidden;
}

button {
  font: inherit;
}

/* =========================
   LOADING
========================= */

#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #101321 0%, #070910 40%, #030407 78%);
  opacity: 1;
}

.loading-stars,
#mainStars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.loading-star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  opacity: .4;
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from {
    opacity: .12;
    transform: scale(.7);
  }
  to {
    opacity: .8;
    transform: scale(1.5);
  }
}

.instruction {
  position: absolute;
  right: 8%;
  bottom: 8%;
  z-index: 5;
  text-align: right;
  color: rgba(235,235,245,.75);
  letter-spacing: .22em;
  font-size: 11px;
  line-height: 2;
  pointer-events: none;
}

.instruction span {
  display: block;
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .18em;
  color: rgba(235,235,245,.45);
}

.meteor {
  position: absolute;
  width: 180px;
  height: 70px;
  z-index: 10;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transform: rotate(135deg);
  transform-origin: center;
  background: transparent;
}

.meteor::before {
  content: "";
  position: absolute;
  left: 0;
  top: 34px;
  width: 155px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3) 35%,
    #fff 100%
  );
  box-shadow: 0 0 8px #fff, 0 0 20px rgba(160,190,255,.8);
}

.meteor::after {
  content: "";
  position: absolute;
  right: 15px;
  top: 30px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 12px 5px white,
    0 0 28px 10px rgba(160,190,255,.7);
}

@keyframes meteorFlight {
  0% {
    left: 110%;
    top: -5%;
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    left: -25%;
    top: 110%;
    opacity: 0;
  }
}

@keyframes starCatch {
  to {
    opacity: 0;
    transform: rotate(135deg) scale(3);
    filter: brightness(3);
  }
}

/* =========================
   CHARACTER LIST
========================= */

#main {
  display: none;
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #101629 0%, #070b15 48%, #04060c 100%);
}

#mainStars {
  z-index: 0;
}

/* 星座の配置 */

.constellation-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.constellation {
  position: absolute;
  overflow: visible;
  opacity: .11;
}

.constellation line,
.constellation polyline {
  fill: none;
  stroke: #b8c9e7;
  stroke-width: .65;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.constellation circle {
  fill: #dce7ff;
  opacity: .65;
}

.constellation .glow-star {
  fill: #fff;
  opacity: .8;
  filter: drop-shadow(0 0 3px #dce7ff);
  animation: constellationGlow 5s ease-in-out infinite alternate;
}

@keyframes constellationGlow {
  0% {
    opacity: .18;
    filter: drop-shadow(0 0 1px #dce7ff);
  }
  100% {
    opacity: .9;
    filter: drop-shadow(0 0 7px #dce7ff);
  }
}

.constellation-one {
  width: 210px;
  top: 5%;
  left: -55px;
  transform: rotate(-12deg);
}

.constellation-two {
  width: 220px;
  top: 28%;
  right: -95px;
  transform: rotate(15deg);
}

.constellation-three {
  width: 190px;
  top: 57%;
  left: -65px;
  transform: rotate(10deg);
}

.constellation-four {
  width: 210px;
  top: 80%;
  right: -95px;
  transform: rotate(-15deg);
}

/* 一覧の文字・画像は前面 */

#main header,
#main .character-list {
  position: relative;
  z-index: 2;
}

header {
  padding: 48px 7% 28px;
  text-align: center;
}

.site-title {
  font-size: 23px;
  letter-spacing: .28em;
  font-weight: normal;
}

.site-jp-title {
  margin-top: 10px;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .2em;
  color: rgba(235,235,245,.75);
}

.site-subtitle {
  margin-top: 28px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .16em;
  line-height: 1.8;
}

.site-tagline {
  margin-top: 8px;
  color: rgba(235,235,245,.65);
  font-family: sans-serif;
  font-size: 11px;
  letter-spacing: .12em;
}

.character-list {
  width: min(900px, 88%);
  margin: 35px auto 80px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 35px 22px;
}

.character-card {
  cursor: pointer;
  text-align: center;
}

.character-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
  background: #101321;
  border: 1px solid rgba(210,210,230,.12);
  transition: opacity .3s;
}

.character-card:active .character-image {
  opacity: .7;
}

.character-name {
  margin-top: 15px;
  font-size: 17px;
  letter-spacing: .12em;
}

.character-jp {
  margin-top: 5px;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .15em;
}

.character-reading {
  margin-top: 5px;
  color: var(--muted);
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .15em;
}

/* =========================
   CHARACTER DETAIL
   星・星座なしのシンプルなネイビー
========================= */

#detail {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 30;
  background: #050811;
  -webkit-overflow-scrolling: touch;
}

.detail-content {
  position: relative;
  width: min(650px, 88%);
  margin: auto;
  padding: 25px 0 75px;
}

/* 戻るボタン */

.back-button {
  display: inline-block;
  border: 1px solid rgba(220,225,240,.2);
  border-radius: 2px;
  background: rgba(255,255,255,.025);
  color: #d8dce8;
  letter-spacing: .14em;
  font-size: 11px;
  padding: 12px 18px;
  cursor: pointer;
}

/* キャラクター画像 */

.detail-image {
  display: block;
  width: min(340px, 88%);
  aspect-ratio: 3 / 4;
  object-fit: cover;
  margin: 32px auto;
  border: 1px solid rgba(220,220,240,.16);
}

/* 名前 */

.detail-name {
  text-align: center;
  font-size: 27px;
  letter-spacing: .13em;
  font-weight: normal;
  line-height: 1.5;
  margin: 0;
}

.detail-jp {
  text-align: center;
  font-family: sans-serif;
  font-size: 15px;
  letter-spacing: .18em;
  margin-top: 12px;
}

.detail-reading {
  text-align: center;
  color: #9ca4b8;
  font-family: sans-serif;
  font-size: 11px;
  margin-top: 8px;
  letter-spacing: .12em;
}

/* 情報セクション */

.section {
  margin-top: 42px;
  padding-top: 24px;
  border-top: 1px solid rgba(220,225,240,.13);
}

.section-title {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .22em;
  margin-bottom: 18px;
}

.section-text {
  white-space: pre-wrap;
  line-height: 2.05;
  font-family: sans-serif;
  font-size: 14px;
  color: #e0e3ec;
  overflow-wrap: anywhere;
}

/* プロンプト */

.prompt-box {
  padding: 20px;
  background: #0b1120;
  border: 1px solid rgba(220,225,240,.14);
  border-radius: 3px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: sans-serif;
  font-size: 13px;
  line-height: 1.9;
  color: #e0e3ec;
}

.copy-button {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 16px;
  border: 1px solid rgba(220,225,240,.28);
  border-radius: 2px;
  background: #111a2b;
  color: white;
  letter-spacing: .2em;
  font-size: 11px;
  cursor: pointer;
}

.copy-button:active {
  background: #1b2940;
}

/* スマートフォン */

@media (max-width: 480px) {
  header {
    padding-top: 42px;
  }

  .site-title {
    font-size: 20px;
  }

  .site-subtitle {
    font-size: 9px;
  }

  .site-tagline {
    font-size: 10px;
  }

  .character-list {
    gap: 28px 14px;
  }

  .character-name {
    font-size: 14px;
  }

  .detail-content {
    width: 88%;
  }

  .detail-name {
    font-size: 24px;
  }

  .section-text {
    font-size: 14px;
  }

  .constellation-one {
    left: -100px;
  }

  .constellation-two {
    right: -125px;
  }

  .constellation-three {
    left: -110px;
  }

  .constellation-four {
    right: -125px;
  }
}
</style>
</head>

<body>

<!-- LOADING -->

<div id="loading">
  <div class="loading-stars" id="loadingStars"></div>

  <div class="instruction">
    CATCH THE STAR
    <span>星を掴んで</span>
  </div>
</div>

<!-- CHARACTER LIST -->

<div id="main">

  <div id="mainStars"></div>

  <div class="constellation-layer">

    <svg class="constellation constellation-one" viewBox="0 0 240 220">
      <polyline points="25,55 65,85 105,35 145,75 195,45"/>
      <line x1="65" y1="85" x2="85" y2="150"/>
      <line x1="85" y1="150" x2="145" y2="75"/>
      <circle cx="25" cy="55" r="2"/>
      <circle cx="65" cy="85" r="2"/>
      <circle class="glow-star" cx="105" cy="35" r="3"/>
      <circle cx="145" cy="75" r="2"/>
      <circle cx="195" cy="45" r="2"/>
      <circle cx="85" cy="150" r="2"/>
    </svg>

    <svg class="constellation constellation-two" viewBox="0 0 260 220">
      <polyline points="35,105 75,65 120,85 160,35 200,80 225,145"/>
      <line x1="75" y1="65" x2="85" y2="155"/>
      <line x1="85" y1="155" x2="145" y2="170"/>
      <line x1="145" y1="170" x2="200" y2="80"/>
      <circle cx="35" cy="105" r="2"/>
      <circle class="glow-star" cx="75" cy="65" r="3"/>
      <circle cx="120" cy="85" r="2"/>
      <circle cx="160" cy="35" r="2"/>
      <circle cx="200" cy="80" r="2"/>
      <circle cx="225" cy="145" r="2"/>
      <circle cx="85" cy="155" r="2"/>
      <circle cx="145" cy="170" r="2"/>
    </svg>

    <svg class="constellation constellation-three" viewBox="0 0 230 220">
      <polyline points="30,45 75,90 115,55 145,110 180,145"/>
      <line x1="75" y1="90" x2="65" y2="155"/>
      <line x1="65" y1="155" x2="145" y2="110"/>
      <circle cx="30" cy="45" r="2"/>
      <circle cx="75" cy="90" r="2"/>
      <circle class="glow-star" cx="115" cy="55" r="3"/>
      <circle cx="145" cy="110" r="2"/>
      <circle cx="180" cy="145" r="2"/>
      <circle cx="65" cy="155" r="2"/>
    </svg>

    <svg class="constellation constellation-four" viewBox="0 0 230 220">
      <polyline points="35,70 85,35 130,80 175,55 195,120"/>
      <line x1="85" y1="35" x2="95" y2="130"/>
      <line x1="95" y1="130" x2="150" y2="160"/>
      <circle cx="35" cy="70" r="2"/>
      <circle class="glow-star" cx="85" cy="35" r="3"/>
      <circle cx="130" cy="80" r="2"/>
      <circle cx="175" cy="55" r="2"/>
      <circle cx="195" cy="120" r="2"/>
      <circle cx="95" cy="130" r="2"/>
      <circle cx="150" cy="160" r="2"/>
    </svg>

  </div>

  <header>
    <div class="site-title">ASTRAL ARCHIVE</div>
    <div class="site-jp-title">アストラル・アーカイブ</div>
    <div class="site-subtitle">
      STORIES GATHERED BENEATH THE STARS
    </div>
    <div class="site-tagline">星々の下に集う、物語の記録</div>
  </header>

  <div class="character-list" id="characterList"></div>

</div>

<!-- CHARACTER DETAIL -->

<div id="detail">
  <div class="detail-content" id="detailContent"></div>
</div>

<script>

/* =========================
   CHARACTER DATA
========================= */

const characters = [
  {
    name: "Character 01",
    japanese: "キャラクター名",
    reading: "よみがな",
    image: "https://dangomu.github.io/IMG_2504.png",
    profile: "プロフィールをここに入力",
    description: "キャラクターの説明をここに入力。",
    prompt: "ここに画像生成用プロンプトを入力"
  },
  {
    name: "Character 02",
    japanese: "キャラクター名",
    reading: "よみがな",
    image: "https://placehold.co/600x800/101321/eeeeee?text=CHARACTER+02",
    profile: "プロフィールをここに入力",
    description: "キャラクターの説明をここに入力。",
    prompt: "ここに画像生成用プロンプトを入力"
  }
];

/* =========================
   STAR GENERATION
========================= */

function addStars(containerId, count, subtle = false) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");

    star.className = "loading-star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 5 + "s";
    star.style.animationDuration = (3 + Math.random() * 5) + "s";

    if (subtle) {
      star.style.opacity = Math.random() * .25;
      star.style.width = "1px";
      star.style.height = "1px";
    }

    container.appendChild(star);
  }
}

addStars("loadingStars", 100);
addStars("mainStars", 55, true);

/* =========================
   METEOR
========================= */

let meteorTimer = null;
let hasEntered = false;

function createMeteor() {
  if (hasEntered) return;

  const meteor = document.createElement("div");
  meteor.className = "meteor";

  document.getElementById("loading").appendChild(meteor);

  meteor.style.animation = "meteorFlight 3.5s linear forwards";

  meteor.addEventListener("pointerdown", catchStar, { once: true });

  meteor.addEventListener("animationend", () => {
    meteor.remove();

    if (!hasEntered) {
      meteorTimer = setTimeout(createMeteor, 1400);
    }
  }, { once: true });
}

function catchStar(event) {
  if (hasEntered) return;

  hasEntered = true;

  const meteor = event.currentTarget;

  clearTimeout(meteorTimer);

  meteor.style.animation = "starCatch .6s ease-out forwards";

  setTimeout(() => {
    const loading = document.getElementById("loading");

    loading.style.transition = "opacity 1.2s ease";
    loading.style.opacity = "0";

    setTimeout(() => {
      loading.style.display = "none";
      document.getElementById("main").style.display = "block";
    }, 1200);

  }, 350);
}

setTimeout(createMeteor, 900);

/* =========================
   CHARACTER LIST
========================= */

function renderCharacters() {
  const list = document.getElementById("characterList");

  list.innerHTML = "";

  characters.forEach((character, index) => {
    const card = document.createElement("div");

    card.className = "character-card";

    card.innerHTML = `
      <img class="character-image" src="${character.image}" alt="">
      <div class="character-name">${character.name}</div>
      <div class="character-jp">${character.japanese}</div>
      <div class="character-reading">${character.reading}</div>
    `;

    card.addEventListener("click", () => openDetail(index));

    list.appendChild(card);
  });
}

renderCharacters();

/* =========================
   DETAIL PAGE
========================= */

function openDetail(index) {
  const character = characters[index];

  const detail = document.getElementById("detail");
  const content = document.getElementById("detailContent");

  content.innerHTML = `
    <button class="back-button" onclick="closeDetail()">← BACK</button>

    <img class="detail-image" src="${character.image}" alt="">

    <h1 class="detail-name">${character.name}</h1>
    <div class="detail-jp">${character.japanese}</div>
    <div class="detail-reading">${character.reading}</div>

    <div class="section">
      <div class="section-title">PROFILE</div>
      <div class="section-text" id="profileText"></div>
    </div>

    <div class="section">
      <div class="section-title">DESCRIPTION</div>
      <div class="section-text" id="descriptionText"></div>
    </div>

    <div class="section">
      <div class="section-title">PROMPT</div>
      <div class="prompt-box" id="promptText"></div>
      <button class="copy-button" onclick="copyPrompt()">COPY PROMPT</button>
    </div>
  `;

  document.getElementById("profileText").textContent = character.profile;
  document.getElementById("descriptionText").textContent = character.description;
  document.getElementById("promptText").textContent = character.prompt;

  detail.style.display = "block";
  detail.scrollTop = 0;
}

function closeDetail() {
  document.getElementById("detail").style.display = "none";
}

/* =========================
   COPY PROMPT
========================= */

function copyPrompt() {
  const text = document.getElementById("promptText").textContent;
  const button = document.querySelector(".copy-button");

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      button.textContent = "COPIED ✓";

      setTimeout(() => {
        button.textContent = "COPY PROMPT";
      }, 1800);
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }

  function fallbackCopy() {
    const textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.select();

    try {
      document.execCommand("copy");
      button.textContent = "COPIED ✓";
    } catch (error) {
      button.textContent = "SELECT AND COPY";
    }

    document.body.removeChild(textarea);

    setTimeout(() => {
      button.textContent = "COPY PROMPT";
    }, 1800);
  }
}

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>ASTRAL ARCHIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b18;color:#e8edf7;font-family:Georgia,"Yu Mincho",serif}
.sky{
 min-height:100svh;padding:24px 8px 18px;overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 40%,#15263a 0%,#091321 55%,#030812 100%);
 position:relative;
}
.sky:before{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.8;
 background-image:
 radial-gradient(1px 1px at 10% 12%,#fff,transparent),
 radial-gradient(1px 1px at 32% 22%,#fff,transparent),
 radial-gradient(2px 2px at 75% 14%,#fff,transparent),
 radial-gradient(1px 1px at 88% 38%,#fff,transparent),
 radial-gradient(1px 1px at 18% 52%,#fff,transparent),
 radial-gradient(2px 2px at 61% 67%,#fff,transparent),
 radial-gradient(1px 1px at 42% 85%,#fff,transparent),
 radial-gradient(1px 1px at 92% 91%,#fff,transparent);
 background-size:150px 160px;
}
header{position:relative;text-align:center}
.eyebrow{font-size:8px;letter-spacing:.38em;color:#b5c5d9}
h1{font-size:clamp(24px,7vw,34px);font-weight:400;letter-spacing:.15em;margin:8px 0 5px}
.subtitle{font-size:8px;letter-spacing:.24em;color:#aabbd0}
.intro{position:relative;text-align:center;font-size:10px;letter-spacing:.15em;color:#b8c6d9;margin:15px 0 4px}
.constellation-map{position:relative;width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.hit{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.hit:active{opacity:.65}
.figure{fill:none;stroke:#a9bacb;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.starline{fill:none;stroke:#e1e9f4;stroke-width:1;opacity:.9}
.star{fill:#fff;filter:drop-shadow(0 0 3px #dceaff)}
.smallstar{fill:#dce8f6;opacity:.8}
footer{position:relative;text-align:center;color:#8192aa;font-size:8px;letter-spacing:.28em;margin-top:0}
#archive{
 display:none;min-height:100svh;padding:28px 20px;
 background:radial-gradient(ellipse at 50% 20%,#1a2b43,#080f1d 70%);
}
.back{border:1px solid #71849e;background:transparent;color:#e8edf7;padding:10px 14px;font:inherit;font-size:10px;letter-spacing:.12em}
.archive-title{text-align:center;font-size:26px;font-weight:400;letter-spacing:.13em;margin:65px 0 10px}
.archive-sub{text-align:center;color:#9cacc1;font-size:9px;letter-spacing:.2em}
.empty{max-width:330px;margin:65px auto;padding:28px 15px;text-align:center;border-top:1px solid #aabbd055;border-bottom:1px solid #aabbd055;color:#b9c6d8;font-size:12px;line-height:2.2}
.sparkle{text-align:center;font-size:25px;color:#dce8f6;margin-bottom:12px}
@media(max-height:720px){
 .sky{padding-top:14px}
 .intro{margin:9px 0 0}
 .constellation-map{max-height:calc(100svh - 125px)}
}
</style>
</head>

<!-- キャラクター紹介ページ -->
<section id="archive">
 <button class="back" onclick="goBack()">← BACK TO THE STARS</button>
 <h2 class="archive-title">CHARACTER ARCHIVE</h2>
 <div class="archive-sub">A COLLECTION OF STORIES</div>
 <div class="empty">
  <div class="sparkle">✧</div>
  ここにキャラクターたちが並びます。<br>
  星空に新しい物語を増やしていきましょう。
 </div>
</section>

<script>
function openArchive(){
 document.getElementById('sky').style.display='none';
 document.getElementById('archive').style.display='block';
 window.scrollTo(0,0);
}
function goBack(){
 document.getElementById('archive').style.display='none';
 document.getElementById('sky').style.display='block';
 window.scrollTo(0,0);
}
document.querySelectorAll('.hit').forEach(item=>{
 item.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openArchive();}
 });
});
</script>

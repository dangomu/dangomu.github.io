
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRAL ARCHIVE</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  color: #f3efff;
  background: #080b1b;
  font-family: serif;
}

header {
  text-align: center;
  padding: 65px 20px 45px;
  background: radial-gradient(ellipse at top, #303765, #080b1b 75%);
}

h1 {
  font-size: 32px;
  letter-spacing: 7px;
  font-weight: normal;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 4px;
  color: #b9b5df;
}

.intro {
  text-align: center;
  padding: 30px 20px;
  color: #c8c4df;
  font-size: 13px;
  line-height: 2;
}

h2 {
  text-align: center;
  font-weight: normal;
  letter-spacing: 4px;
  font-size: 18px;
  margin: 35px 0 25px;
}

.characters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 0 18px 50px;
  max-width: 650px;
  margin: auto;
}

.character {
  border: 1px solid #45456e;
  background: #151a32;
  padding: 25px 12px;
  text-align: center;
  border-radius: 4px;
}

.symbol {
  font-size: 30px;
  color: #c7b9ff;
}

.name {
  margin-top: 12px;
  letter-spacing: 2px;
}

.detail {
  font-size: 10px;
  color: #aaa8c8;
  margin-top: 8px;
}

footer {
  text-align: center;
  padding: 25px;
  border-top: 1px solid #333653;
  font-size: 10px;
  color: #8888aa;
  letter-spacing: 2px;
}
</style>
</head>
<body>

<header>
  <div class="subtitle">✦ CELESTIAL COLLECTION ✦</div>
  <h1>ASTRAL ARCHIVE</h1>
  <div class="subtitle">CHARACTER PROMPT LIBRARY</div>
</header>

<section class="intro">
  星々に記された、物語とキャラクター。<br>
  お気に入りの存在を見つけてください。
</section>

<h2>✧ CHARACTER ARCHIVE ✧</h2>

<section class="characters">
  <div class="character">
    <div class="symbol">✦</div>
    <div class="name">COMING SOON</div>
    <div class="detail">NEW CHARACTER</div>
  </div>
  <div class="character">
    <div class="symbol">☾</div>
    <div class="name">COMING SOON</div>
    <div class="detail">NEW CHARACTER</div>
  </div>
</section>

<footer>
  ASTRAL ARCHIVE © 2026
</footer>

</body>
</html>

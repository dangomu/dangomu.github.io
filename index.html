
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRAL ARCHIVE</title>

<style>
:root {
  --bg: #030407;
  --white: #eeeeF4;
  --muted: #9295a8;
  --gold: #d8c9a0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  min-height: 100vh;
  overflow-x: hidden;
}

button {
  font: inherit;
}

/* LOADING */

#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #101321 0%, #070910 40%, #030407 78%);
}

.loading-stars,
#detailStars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.loading-star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  opacity: .4;
  animation: twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.7); }
  to { opacity: .9; transform: scale(1.5); }
}

.instruction {
  position: absolute;
  right: 8%;
  bottom: 8%;
  z-index: 5;
  text-align: right;
  color: rgba(235, 235, 245, .75);
  letter-spacing: .22em;
  font-size: 11px;
  line-height: 2;
  pointer-events: none;
}

.instruction span {
  display: block;
  font-family: sans-serif;
  font-size: 10px;
  letter-spacing: .18em;
  color: rgba(235, 235, 245, .45);
}

.meteor {
  position: absolute;
  width: 130px;
  height: 2px;
  z-index: 10;
  cursor: pointer;
  transform: rotate(135deg);
  transform-origin: center;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3) 35%,
    #fff 100%
  );
  box-shadow: 0 0 8px #fff, 0 0 20px rgba(160,190,255,.8);
  animation: meteorFlight 2.8s linear forwards;
}

.meteor::after {
  content: "";
  position: absolute;
  right: -5px;
  top: -4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px 5px white, 0 0 28px 10px rgba(160,190,255,.7);
}

@keyframes meteorFlight {
  0% {
    left: 110%;
    top: -5%;
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    left: -25%;
    top: 110%;
    opacity: 0;
  }
}

.meteor.caught {
  animation: starCatch .6s ease-out forwards;
}

@keyframes starCatch {
  to {
    opacity: 0;
    transform: rotate(135deg) scale(3);
    filter: brightness(3);
  }
}

/* MAIN */

#main {
  display: none;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #111629 0%, #070910 45%, #030407 100%);
}

header {
  padding: 38px 7% 24px;
  text-align: center;
}

.site-title {
  font-size: 23px;
  letter-spacing: .28em;
  font-weight: normal;
}

.site-subtitle {
  margin-top: 10px;
  color: var(--muted);
  font-family: sans-serif;
  font-size: 9px;
  letter-spacing: .3em;
}

.character-list {
  width: min(900px, 88%);
  margin: 30px auto 80px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 35px 22px;
}

.character-card {
  cursor: pointer;
  text-align: center;
}

.character-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
  background: #101321;
  border: 1px solid rgba(210,210,230,.12);
  transition: .5s;
}

.character-card:active .character-image {
  opacity: .7;
}

.character-name {
  margin-top: 15px;
  font-size: 17px;
  letter-spacing: .12em;
}

.character-jp {
  margin-top: 5px;
  font-family: sans-serif;
  font-size: 12px;
  letter-spacing: .15em;
}

.character-reading {
  margin-top: 5px;
  color: var(--muted);
  font-family: sans-serif;
  font-size: 9px;
  letter-spacing: .15em;
}

/* DETAIL */

#detail {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  z-index: 30;
  background: #030407;
}

.detail-sky {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, #11182a 0%, #080b15 48%, #030407 100%);
  pointer-events: none;
}

#detailStars {
  position: fixed;
  z-index: 0;
}

.detail-content {
  position: relative;
  z-index: 2;
  width: min(650px, 88%);
  margin: auto;
  padding: 35px 0 70px;
}

.back-button {
  border: 0;
  background: none;
  color: rgba(255,255,255,.7);
  letter-spacing: .15em;
  font-size: 11px;
  padding: 12px 0;
  cursor: pointer;
}

.detail-image {
  display: block;
  width: min(330px, 85%);
  aspect-ratio: 3 / 4;
  object-fit: cover;
  margin: 25px auto;
  border: 1px solid rgba(220,220,240,.2);
}

.detail-name {
  text-align: center;
  font-size: 26px;
  letter-spacing: .15em;
  font-weight: normal;
}

.detail-jp {
  text-align: center;
  font-family: sans-serif;
  font-size: 13px;
  letter-spacing: .2em;
  margin-top: 10px;
}

.detail-reading {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  margin-top: 6px;
}

.section {
  margin-top: 42px;
}

.section-title {
  color: var(--gold);
  font-size: 11px;
  letter-spacing: .25em;
  margin-bottom: 15px;
}

.section-text {
  white-space: pre-wrap;
  line-height: 2;
  font-family: sans-serif;
  font-size: 13px;
  color: rgba(240,240,248,.8);
}

.prompt-box {
  padding: 18px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(220,220,240,.14);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: sans-serif;
  font-size: 12px;
  line-height: 1.8;
  color: rgba(240,240,248,.8);
}

.copy-button {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 1px solid rgba(220,220,240,.3);
  background: rgba(255,255,255,.06);
  color: white;
  letter-spacing: .2em;
  font-size: 10px;
  cursor: pointer;
}

@media (max-width: 480px) {
  .character-list {
    gap: 28px 14px;
  }
  .character-name {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="loading-stars" id="loadingStars"></div>

  <div class="instruction">
    CATCH THE STAR
    <span>星を掴んで</span>
  </div>
</div>

<!-- CHARACTER LIST -->
<div id="main">
  <header>
    <div class="site-title">ASTRAL ARCHIVE</div>
    <div class="site-subtitle">A COLLECTION OF CHARACTERS</div>
  </header>
  <div class="character-list" id="characterList"></div>
</div>

<!-- CHARACTER DETAIL -->
<div id="detail">
  <div class="detail-sky"></div>
  <div id="detailStars"></div>
  <div class="detail-content" id="detailContent"></div>
</div>

<script>
/* CHARACTER DATA
   ここにキャラクター情報を追加していくよ */

const characters = [
  {
    name: "Character 01",
    japanese: "キャラクター名",
    reading: "よみがな",
    image: "https://placehold.co/600x800/101321/eeeeee?text=CHARACTER+01",
    profile: "プロフィールをここに入力",
    description: "キャラクターの説明をここに入力。",
    prompt: "ここに画像生成用プロンプトを入力"
  },
  {
    name: "Character 02",
    japanese: "キャラクター名",
    reading: "よみがな",
    image: "https://placehold.co/600x800/101321/eeeeee?text=CHARACTER+02",
    profile: "プロフィールをここに入力",
    description: "キャラクターの説明をここに入力。",
    prompt: "ここに画像生成用プロンプトを入力"
  }
];

/* LOADING STARS */

const loadingStars = document.getElementById("loadingStars");

for (let i = 0; i < 100; i++) {
  const star = document.createElement("div");
  star.className = "loading-star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 4 + "s";
  star.style.animationDuration = (2 + Math.random() * 4) + "s";
  loadingStars.appendChild(star);
}

/* METEOR */

let meteorTimer = null;
let currentMeteor = null;
let hasEntered = false;

function createMeteor() {
  if (hasEntered) return;

  const meteor = document.createElement("div");
  meteor.className = "meteor";
  document.getElementById("loading").appendChild(meteor);
  currentMeteor = meteor;

  meteor.addEventListener("click", catchStar);
  meteor.addEventListener("animationend", () => {
    if (meteor.parentNode) meteor.remove();

    if (!hasEntered) {
      meteorTimer = setTimeout(createMeteor, 1300);
    }
  }, { once: true });
}

function catchStar(event) {
  if (hasEntered) return;
  hasEntered = true;

  const meteor = event.currentTarget;
  meteor.classList.add("caught");

  clearTimeout(meteorTimer);

  setTimeout(() => {
    document.getElementById("loading").style.transition = "opacity 1.2s";
    document.getElementById("loading").style.opacity = "0";

    setTimeout(() => {
      document.getElementById("loading").style.display = "none";
      document.getElementById("main").style.display = "block";
    }, 1200);
  }, 450);
}

setTimeout(createMeteor, 900);

/* CHARACTER LIST */

function renderCharacters() {
  const list = document.getElementById("characterList");
  list.innerHTML = "";

  characters.forEach((character, index) => {
    const card = document.createElement("div");
    card.className = "character-card";

    card.innerHTML = `
      <img class="character-image" src="${character.image}" alt="">
      <div class="character-name">${character.name}</div>
      <div class="character-jp">${character.japanese}</div>
      <div class="character-reading">${character.reading}</div>
    `;

    card.addEventListener("click", () => openDetail(index));
    list.appendChild(card);
  });
}

renderCharacters();

/* DETAIL STARS */

const detailStars = document.getElementById("detailStars");

for (let i = 0; i < 420; i++) {
  const star = document.createElement("div");
  star.className = "loading-star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 5 + "s";
  star.style.animationDuration = (2 + Math.random() * 5) + "s";
  star.style.opacity = Math.random() * .8;
  detailStars.appendChild(star);
}

/* OPEN DETAIL */

function openDetail(index) {
  const c = characters[index];
  const detail = document.getElementById("detail");
  const content = document.getElementById("detailContent");

  content.innerHTML = `
    <button class="back-button" onclick="closeDetail()">← BACK</button>

    <img class="detail-image" src="${c.image}" alt="">

    <h1 class="detail-name">${c.name}</h1>
    <div class="detail-jp">${c.japanese}</div>
    <div class="detail-reading">${c.reading}</div>

    <div class="section">
      <div class="section-title">PROFILE</div>
      <div class="section-text">${c.profile}</div>
    </div>

    <div class="section">
      <div class="section-title">DESCRIPTION</div>
      <div class="section-text">${c.description}</div>
    </div>

    <div class="section">
      <div class="section-title">PROMPT</div>
      <div class="prompt-box" id="promptText"></div>
      <button class="copy-button" onclick="copyPrompt()">COPY PROMPT</button>
    </div>
  `;

  document.getElementById("promptText").textContent = c.prompt;
  detail.style.display = "block";
  detail.scrollTop = 0;
}

function closeDetail() {
  document.getElementById("detail").style.display = "none";
}

/* COPY PROMPT */

function copyPrompt() {
  const text = document.getElementById("promptText").textContent;

  navigator.clipboard.writeText(text).then(() => {
    const button = document.querySelector(".copy-button");
    button.textContent = "COPIED ✓";

    setTimeout(() => {
      button.textContent = "COPY PROMPT";
    }, 1800);
  }).catch(() => {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("promptText"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    alert("プロンプトを選択したよ。コピーしてね。");
  });
}
</script>

</body>
</html>
